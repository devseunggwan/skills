name: ci

# Single consolidated CI workflow (issue #590). Triggers are unified to
# push-on-main + pull_request so a feature-branch push with an open PR runs
# each check once (the prior per-tool workflows used push:["**"] and double-ran
# on every PR). codeql stays in its own file — its weekly schedule and
# security-events:write scope don't belong on the shared trigger.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege default: jobs only read the checked-out code. The reviewdog
# jobs widen to pull-requests:write at the job level. No job pushes back to the
# repo, so every checkout sets persist-credentials: false — the GITHUB_TOKEN is
# not left in .git/config for later steps (pip/apt/run-tests.sh) to reach.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          # No dependency manifest; hash this workflow (which pins ruff) for a
          # stable pip-cache key.
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # Pinned so a future Ruff release can't widen rules and turn CI red
      # without an explicit bump. Matches ruff.toml's rule selection.
      - run: python3 -m pip install "ruff==0.15.8"
      - run: ruff check .

  mypy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # Pinned so a future mypy release can't tighten inference and turn CI
      # red without an explicit bump — the ruff pin's reasoning. types-PyYAML
      # is the stub package for scripts/check-workflow-pins.py's PyYAML import
      # (the one third-party import in scope); it is pinned on the same ground,
      # and stubs alone are enough — mypy never imports the runtime package.
      # Scope and flags live in mypy.ini, so the invocation carries no
      # arguments and scripts/run-tests.sh step 13 cannot drift from it.
      # Bump the two pins here and in run-tests.sh together.
      - run: python3 -m pip install "mypy==1.20.0" "types-PyYAML==6.0.12.20260815"
      - run: python3 -m mypy

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned upstream binary (version + sha256), not apt: apt resolves an
      # unpinned 0.9.0 while the zero-excludes runtime pass was verified on
      # 0.11.0, and a silent version bump must not widen rules — same reasoning
      # as the ruff pin. The script installs the same version for the `test`
      # job, so the two blocking shellcheck runs cannot disagree.
      - run: bash scripts/ci-shellcheck.sh
      # File discovery is delegated to scripts/shellcheck-files.sh (see its
      # header for the enumeration rules; it also covers the extensionless
      # skills/ CLI scripts, #1175)
      # and shared verbatim with scripts/run-tests.sh step 9 so the two file
      # sets cannot drift. Two invocations: runtime code gets no rule
      # exclusions; tests/ excludes SC2154/SC2034, the test-harness-only false
      # positives that used to be disabled repo-wide via .shellcheckrc (see its
      # comments). Both invocations always run — a runtime failure must not
      # short-circuit the tests pass, matching run-tests.sh step 9.
      - run: |
          set -o pipefail
          rc=0
          bash scripts/shellcheck-files.sh runtime \
            | xargs -0 shellcheck --severity=warning || rc=1
          bash scripts/shellcheck-files.sh tests \
            | xargs -0 shellcheck --severity=warning --exclude=SC2154,SC2034 || rc=1
          exit "$rc"

  # Trigger moved from push:["**"] to push:[main]+PR, so pre-PR pushes to a
  # feature branch are intentionally unscanned. Coverage for anything that
  # reaches main is unchanged: the PR event scans it, and the post-merge
  # push:[main] re-scans full history (fetch-depth:0) — no secret lands on
  # main unscanned, it's just scanned at PR time instead of first-push time.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history so gitleaks scans commits, not just the working tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Synthetic test secrets are allowlisted in .gitleaks.toml.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required for pull_request scans: the action enumerates the PR's
          # commits via the API. push events scan locally without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # fetch-depth:0 — what needs it is run-tests.sh's markdownlint step: it
      # diffs against `git merge-base HEAD origin/main` to lint only the
      # markdown the PR changed. A depth-1 PR checkout has no origin/main, so
      # the step falls back to linting every tracked markdown file and buries
      # the log in the repo's known backlog; still advisory, but no longer a
      # useful signal. Nothing else in this job reads history: the paren gate's
      # corpus used to be read back with `git log -1 <sha>` (exit 128 on a
      # shallow clone) and now ships as text fixtures under
      # tests/fixtures/commit-message-paren-check/, whose live-compare case
      # skips itself when the commits are absent (issue #1302).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # ruff is pinned to the same version as the `ruff` job so the local-parity
      # step cannot disagree with the blocking one. PyYAML is what
      # scripts/check-workflow-pins.py parses workflows with; pinned for the
      # same reason, since a parser change moves what the canary can see.
      # coverage is pinned on the same ground as ruff (issue #1303): the pytest
      # step of run-tests.sh gates on the `fail_under` floor in .coveragerc, and
      # a coverage.py release can move what counts as a statement — the
      # measured total shifting under a fixed floor is exactly the silent
      # red-without-a-bump the ruff pin exists to prevent. run-tests.sh's skip
      # hint names the same version; bump both together.
      # mypy and its types-PyYAML stub are pinned to the `mypy` job's versions
      # on the ruff ground: run-tests.sh step 13 is the local-parity mirror,
      # and under PRAXIS_TESTS_STRICT an absent mypy would fail this job as a
      # skip rather than run the check.
      - run: |
          python3 -m pip install pytest "ruff==0.15.8" "PyYAML==6.0.3" \
            "coverage==7.16.0" "mypy==1.20.0" "types-PyYAML==6.0.12.20260815"
      # zsh is not preinstalled on ubuntu-24.04. block-unmatched-glob delegates
      # its verdict to a real zsh, so without it that hook's suite has nothing to
      # assert against and silently degrades to fail-open coverage.
      # jq is installed explicitly (#1170): the runner image ships it today, but
      # two sub-suites (test_no_live_keys_in_fixtures, test_catalog_monotonic)
      # skip themselves without it, and depending on the image is exactly the
      # silent-degradation path the PRAXIS_SUBSKIP protocol exists to catch.
      # markdownlint-cli2 still comes from npm for the same reason ruff is
      # pinned: under PRAXIS_TESTS_STRICT its absence would abort the run (#917).
      # tmux is installed on the same ground as jq: this PR's own suite
      # (test_cmux_session_orphan_windows) skips itself without it, and a
      # prerequisite the runner image happens to ship is one the image can stop
      # shipping without any signal here.
      # The phase bound and the retry around it both live in scripts/ci-apt.sh,
      # which carries the reasoning (#1046 bounded the stall, #1049 made it
      # survivable). A stalled mirror was observed killing this step three times
      # before the bound, and again after it -- bounding made the failure fast,
      # the retry is what can make it pass.
      - run: bash scripts/ci-apt.sh zsh jq tmux
      # shellcheck is no longer taken from the runner image (0.9.0): step 10 of
      # run-tests.sh must run the same pinned version as the `shellcheck` job,
      # so the local-parity step cannot disagree with the blocking one (the ruff
      # pin above exists for the same reason).
      - run: bash scripts/ci-shellcheck.sh
      # Pinned for the same reason ruff is: an unpinned install floats to the
      # newest release, so a markdownlint-cli2 release could change lint
      # behavior (or break install) without an explicit bump (issue #1171).
      # scripts/run-tests.sh's markdownlint step documents the same version
      # for local parity. Bump both together.
      - run: npm install -g markdownlint-cli2@0.23.2
      # Strict: in CI the toolchain is installed, so a SKIPPED line means the
      # run silently stopped checking something rather than accommodating a
      # contributor's machine. markdownlint stays advisory — strict gates on a
      # step being skipped, not on its findings.
      # COVERAGE_FILE is pinned to the workspace so the data file outlives the
      # runner's throwaway PRAXIS_HOME (its default location, swept by an EXIT
      # trap) and the summary step below can re-read it. .coverage is
      # gitignored; the runner never pushes, so nothing here can commit it.
      - run: bash scripts/run-tests.sh
        env:
          PRAXIS_TESTS_STRICT: "1"
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
      # Per-file coverage table on the job summary (issue #1303). The floor
      # already gated inside run-tests.sh; this step only renders the same
      # data, so it inherits the pass. coverage 7.16.0 supports
      # --format=markdown (verified against `coverage report --help`).
      - run: python3 -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage

  link-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --offline: only validate local file-path links and in-document
      # fragments. External URLs (mostly github.com) are skipped to avoid
      # unauthenticated 429 false failures. --exclude-path '^plugins/': those
      # dirs are symlinks back into the repo root and would re-scan every doc
      # under a plugins/ path where relative links resolve wrong.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --offline
            --exclude-path '^plugins/'
            --include-fragments
            './**/*.md'
          fail: true

  # reviewdog posts inline review comments, which only works in PR context —
  # so the two reviewdog jobs are gated to pull_request and skip on push:main.
  actionlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the latest release; existing workflows pass actionlint
      # cleanly, so error-level gating starts from green.
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          # Workflow YAML errors are real bugs, not style — gate at error.
          fail_level: error

  markdownlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # reviewdog/action-markdownlint is a Docker container action built from
      # its Dockerfile at job time (node:24-bullseye-slim plus apt-get). On
      # 2026-09-06 a Debian bullseye-security mirror 404 inside that build
      # failed the job on every open PR, release-please's included, before
      # any input was read, so its `fail_level: none` never applied and each
      # commit status went red for a check that gates nothing. The steps
      # below run the same two-phase pipeline the action's entrypoint runs,
      # with the markdownlint-cli and reviewdog versions its v0.28.0 image
      # bundles, and no image build. Rule config still lives in
      # .markdownlint.yaml (counts derived under this markdownlint-cli
      # version — see that file's header).
      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0
      - run: npm install -g markdownlint-cli@0.49.1
      - name: markdownlint findings and fix suggestions
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Phase 1: findings on lines the PR changed only; the repo's large
          # existing backlog stays untouched. Advisory rollout: warnings only,
          # never fails the check.
          markdownlint . 2>&1 | reviewdog \
            -efm="%f:%l:%c %m" \
            -efm="%f:%l %m" \
            -name="markdownlint" \
            -reporter=github-pr-review \
            -filter-mode=added \
            -level=warning \
            -fail-level=none
          # Phase 2: the same suggestion comments the action posts under
          # github-pr-review, from markdownlint --fix as a diff.
          markdownlint --fix . 2>&1 || true
          fix_diff="$(mktemp)"
          git diff > "$fix_diff"
          git checkout -- .
          reviewdog \
            -f=diff \
            -f.diff.strip=1 \
            -name="markdownlint-fix" \
            -reporter=github-pr-review \
            -filter-mode=diff_context \
            -level=warning < "$fix_diff"
