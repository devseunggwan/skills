# mypy configuration for the praxis Python sources (issue #1301).
#
# Scope note: same footing as ruff.toml — this repo ships no package manifest,
# Python code is stdlib-only at runtime, and CI installs mypy inline (pinned
# in .github/workflows/ci.yml; scripts/run-tests.sh step 13 mirrors it).
#
# Deliberately narrow first rollout: the shared runtime library and the
# repo-internal scripts. hooks/**/impl.py and tests/ are a later PR — every
# impl.py reaches _lib through a sys.path insert and carries a purposeful
# `# type: ignore[import-not-found]` for it, so widening `files` below is a
# scope decision, not a config edit; keep this list in step with that PR.
[mypy]
# `str | None` union syntax is used throughout, so 3.10 is the floor
# (matches ruff.toml's target-version).
python_version = 3.10
files = hooks/_lib, scripts
exclude = __pycache__
# Imports resolved at runtime through paths mypy cannot see (a hook's
# sys.path insert, a skill's helper) are not type errors here.
ignore_missing_imports = True
# Those `# type: ignore[import-not-found]` comments exist on purpose and are
# "unused" from mypy's own view whenever the target does resolve. Leave this
# off so a resolvable import cannot turn its own ignore into an error.
warn_unused_ignores = False
